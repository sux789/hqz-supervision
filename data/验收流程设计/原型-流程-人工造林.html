<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>验收流程界面原型 · 流程-人工造林</title>
<style>
:root{
  --bg:#f7f7f5; --card:#fff; --line:rgba(0,0,0,.12); --line2:rgba(0,0,0,.28);
  --tx:#1c1c1a; --tx2:#5f5e5a; --tx3:#8a8984;
  --ok:#0f6e56; --okbg:#e1f5ee;
  --info:#185fa5; --infobg:#e6f1fb;
  --warn:#854f0b; --warnbg:#faeeda;
  --bad:#a32d2d; --badbg:#fcebeb;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
h1{font-size:16px;font-weight:500;margin:0}
h2{font-size:14px;font-weight:500;margin:0}
h3{font-size:13px;font-weight:500;margin:0}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.tiny{font-size:11px}.sm{font-size:12px}
hr{border:0;border-top:.5px solid var(--line);margin:14px 0}

/* 顶栏 */
.top{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:20;border-bottom:.5px solid var(--line)}
.toprow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

/* 小班选择 */
.pick{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:12px 0}
.pick select{width:100%;padding:8px;font:inherit;font-size:13px;border:.5px solid var(--line2);border-radius:8px;background:#fff}
.rowmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px 12px;margin-top:10px}
.rowmeta div{font-size:12px}
.rowmeta span{color:var(--tx3)}

/* 步骤条 */
.steps{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:thin}
.step{flex:0 0 auto;width:66px;text-align:center;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
.step .dot{width:26px;height:26px;margin:0 auto 5px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#eeede8;color:var(--tx3);border:.5px solid transparent}
.step .nm{font-size:11px;color:var(--tx3);line-height:1.3}
.step.done .dot{background:var(--okbg);color:var(--ok)}
.step.done .nm{color:var(--tx2)}
.step.cur .dot{background:var(--infobg);color:var(--info);border-color:var(--info);font-weight:500}
.step.cur .nm{color:var(--info);font-weight:500}
.step.lock{opacity:.5}
.step.lock .nm::after{content:" 🔒";font-size:9px}

/* 环节卡 */
.card{background:var(--card);border:.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.card.locked{background:#fbfbf9}
.badge{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--infobg);color:var(--info)}
.badge.w{background:var(--warnbg);color:var(--warn)}
.badge.g{background:var(--okbg);color:var(--ok)}

/* 因子行 */
.factor{border-top:.5px solid var(--line);padding:12px 0 0;margin-top:12px}
.factor:first-of-type{border-top:0;padding-top:0;margin-top:10px}
.fhead{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.fname{font-size:13px;font-weight:500}
.req{color:var(--bad);font-size:12px}
.std{font-size:11px;color:var(--tx3);margin-bottom:8px}
.std b{color:var(--tx2);font-weight:500}
.ctl{display:grid;gap:8px}
.ctl input,.ctl select,.ctl textarea{width:100%;padding:8px 10px;font:inherit;font-size:13px;border:.5px solid var(--line2);border-radius:8px;background:#fff}
.ctl input:disabled{background:#f4f4f1;color:var(--tx2)}
.ctl textarea{min-height:66px;resize:vertical}
.ctl.n3{grid-template-columns:repeat(3,1fr)}
.chk{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.chk input{width:16px;height:16px}
.verdict{font-size:11px;margin-top:5px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.hint{color:var(--tx3)}
.multi{display:flex;gap:12px;flex-wrap:wrap;padding-top:2px}

/* 附件 */
.att{margin-top:14px;padding-top:12px;border-top:.5px solid var(--line)}
.attbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:13px;padding:7px 12px;border:.5px solid var(--line2);border-radius:8px;background:#fff;cursor:pointer}
button:active{background:#f0efec}
button.pri{background:var(--ok);color:#fff;border-color:var(--ok)}
button.pri:active{background:#0d5c48}
button:disabled{opacity:.42;cursor:not-allowed}
button.sm{padding:4px 9px;font-size:12px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.th{width:42px;height:42px;border-radius:6px;background:#f0efec;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx2);position:relative}
.th.add{background:#fff;border:.5px dashed var(--line2);color:var(--tx3);font-size:17px}
.th .n{position:absolute;right:2px;bottom:1px;font-size:9px;color:var(--tx3)}
.th.done{background:var(--okbg);color:var(--ok)}

/* 提交栏 */
.submit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f0efec;border-radius:var(--r);padding:11px 14px;margin-top:12px}
.submit .prog{font-size:12px;color:var(--tx2)}
.submit .why{margin-left:auto;font-size:12px;color:var(--warn)}
.submit button.pri{margin-left:auto}

/* 解析器演示 */
pre{background:#fff;border:.5px solid var(--line);border-radius:8px;padding:10px;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;margin:6px 0 0;white-space:pre-wrap;word-break:break-all}
details{border:.5px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--card);margin-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--tx2)}
.tagx{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin:3px 4px 0 0}
.tagx.p{background:var(--okbg);color:var(--ok)}
.tagx.u{background:var(--infobg);color:var(--info)}
.tagx.warn{background:var(--warnbg);color:var(--warn)}
.warnbox{background:var(--warnbg);border:.5px solid #e0b872;border-radius:8px;padding:9px 12px;margin-top:10px;font-size:12px;color:#6b4008}
</style>
</head>

<div class="top">
  <div class="toprow">
    <h1>验收 · <span id="flowName">人工造林</span></h1>
    <span class="mut sm" id="sub">—</span>

  <select id="wbPick"></select>
  <div class="rowmeta" id="rowMeta"></div>
  <div id="flowHit"></div>
</div>

<div id="panel"></div>

<div class="submit" id="submitBar"></div>

<details>
  <summary>附件要求解析器 · 自然语言 → 按钮配置</summary>
  <div id="parseDemo"></div>
</details>

  <div id="ctlDemo"></div>
</details>

<div class="warnbox" id="pitfall"></div>

</div>

/* ============================================================
   解析器 1：流程匹配（条件字段/条件值 成对全满足；优先级小者先）
   ============================================================ */
function matchFlow(row, fileScope){
  var hit = null;
  REGISTRY.forEach(function(r){
    if(!r.enabled || r.demo) return;                       // 演示行不参与
    if(r.scope!=='全部' && r.scope!==fileScope) return;
    if(r.condField==='1' || !r.condField){
      if(!hit || r.prio<hit.prio) hit=r; return;
    }
    var fs=r.condField.split(';'), vs=(r.condVal||'').split(';');
    var ok = fs.every(function(f,i){
      var a=String(row[f]==null?'':row[f]).trim();
      var b=String(vs[i]==null?'':vs[i]).trim();
      return a===b;
    });
    if(ok && (!hit || r.prio<hit.prio)) hit=r;
  });
  return hit;
}

   ============================================================ */

   fixed=true 表示该标签用规则里的规范名（避免片段文本被剥得太碎）。*/

  {re:/照片|现场/, kind:'photo', label:'现场照片', min:0, fixed:true}

/* 括号感知分割：分号只在括号外才算分隔符。
   控件列里 下拉(符合设计;部分完成;未完成) 的分号在括号内，不能切。 */
function splitTop(text, sep){
  var out=[], buf='', depth=0;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(ch==='('||ch==='（') depth++;
    else if(ch===')'||ch==='）') depth--;
    if(ch===sep && depth<=0){ out.push(buf); buf=''; continue; }
    buf+=ch;
  }
  out.push(buf);
  return out;
}

function parseAtt(text){
  var t=String(text||'').trim(); if(!t) return [];
  if(/^(拍照|上传|打卡):/.test(t)){
    return splitTop(t,';').map(function(s){
      s=s.trim(); if(!s) return null;
      var m=/^(拍照|上传|打卡):(.+?)(?:@(\d+))?$/.exec(s);
      if(!m) return null;
      return {kind:m[1]==='拍照'?'photo':(m[1]==='上传'?'upload':'punch'),
              label:m[2], min:m[3]?+m[3]:0, raw:s};
    }).filter(Boolean);
  }
  /* 自然语言兜底：按顿号/逗号/加号切片段，一片 = 一个按钮（现场语义最贴近原文）。
     片段若无任何关键词，则并入上一片（处理「撑杆、覆膜照片」这种省略写法）。*/
  var parts=t.split(/[、，,＋+]/).map(function(x){return x.trim();}).filter(Boolean);
  var merged=[];
  parts.forEach(function(p){
    if(!ATT_RULES.some(function(r){return r.re.test(p);}) && merged.length) merged[merged.length-1]+='、'+p;
    else merged.push(p);
  });
  var out=[], seen={};
  merged.forEach(function(p){
    /* 按 ATT_RULES 顺序取第一条命中的规则（越靠前越具体），
       避免「照片|现场」兜底规则重复追加一个"现场照片"按钮 */
    var rule=null;
    for(var i=0;i<ATT_RULES.length;i++){ if(ATT_RULES[i].re.test(p)){ rule=ATT_RULES[i]; break; } }
    var kind='photo', min=0;
    if(rule){ kind=rule.kind; min=rule.min; }
    /* "各 1 张" → 该片段按钮要求至少 N 张 */
    var per=/各\s*(\d+)\s*张/.exec(p);
    var label = rule ? (rule.fixed ? rule.label : tidyLabel(p)) : tidyLabel(p);
    var warn = (per && min && min !== +per[1]) ? '“各'+per[1]+'张”与该按钮下限冲突，取 '+per[1] : '';
    if(per && !min) min=+per[1];
    var key=kind+'/'+label;
    if(seen[key]) return;
    seen[key]=1;
    out.push({kind:kind, label:label, min:min, raw:p, warn:warn});
  });
  if(!out.length) out.push({kind:'photo', label:t, min:0, raw:t});
  return out;

  /* 标签取片段自身，剥掉「照片」「各N张」这类尾巴，读起来就是现场话术 */
  function tidyLabel(p){
    return p.replace(/各\s*\d+\s*张/g,'').replace(/照片?$/,'').replace(/的$/,'').trim() || p;
  }
}

/* ============================================================
   解析器 3：「填报控件」列 → 控件实例
   语法：字段名=类型(参数;参数)
   ============================================================ */
var OPTION_POOL = {
  '整地方式':['穴状','撩壕整地'],
  '完成情况':['符合设计','部分完成','未完成'],
  '病虫害情况':['无','轻微','严重'],
  '验收结果':['合格','不合格','整改后合格'],
  '管护作业情况':['浇水','培土','补植','病虫害防治']
};
function parseCtl(text){
  var out=[];
  splitTop(String(text||''),';').forEach(function(s){
    s=s.trim(); if(!s) return;
    var i=s.indexOf('='); if(i<0) return;
    var name=s.slice(0,i).trim();
    var rest=s.slice(i+1).trim();
    var type, arg='';
    var m=/^([^(（]+)\((.*)\)$/.exec(rest);
    if(m){ type=m[1].trim(); arg=m[2]; }
    else { type=rest.trim(); }
    out.push({name:name, type:type, arg:arg});
  });
  return out;
}

/* 环节解锁判定：转序规则 */
function unlocked(i){
  if(i===0) return true;
  var p=S.steps[i-1];
  if(S.submitted[i-1]) return true;
  return false;
}
function doneCount(){ var n=0; for(var k in S.submitted) if(S.submitted[k]) n++; return n; }

/* 标准值取自 data（trim 匹配，兼容「总株数  」尾随空格） */
/* 确认项因子 → data 列名兜底别名（因子口径词 ≠ 列名时对照） */
var STD_ALIAS={'小班边界':'小班号','面积':'小班面积','造林类型':'项目类型','树种':'造林树种'};
function stdOf(name, row){
  var keys=Object.keys(row);
  for(var i=0;i<keys.length;i++){
    if(keys[i].trim()===name) return row[keys[i]];
  }
  var a=STD_ALIAS[name];
  if(a!=null){
    for(var j=0;j<keys.length;j++){
      if(keys[j].trim()===a) return row[keys[j]];
    }
  }
  return undefined;
}

/* 成活率 =(抽查−死亡)/抽查；保存率 = 存活/抽查（口径不同，勿混用） */
function rateOf(def,d){
  var s=d['抽查株数'], dd=d[def.no===6?'死亡株数':'存活株数'];
  return (s>0 && dd!=null && dd!=='') ? (def.no===6 ? 100*(s-dd)/s : 100*dd/s) : null;
}
function gateOf(i, def){
  var d=S.data[i]||{}, miss=[];
  var ctls=parseCtl(def.ctl);
  ctls.forEach(function(c){
    var n=c.name;
    if(['验收人','验收日期','整改期限','验收结果'].indexOf(n)>=0) return;
    if(n==='确认项'){
      var items=def.factors.split('、'), ck=d['确认项']||{};
      if(items.some(function(x){return !ck[x];})) miss.push('确认项 '+items.filter(function(x){return !ck[x];}).length+' 项未勾');
      return;
    }
    if(c.type.indexOf('多选')===0){
      if(!(d[n]&&d[n].length)) miss.push(n);
      return;
    }
    if(c.type.indexOf('多行纯文本')===0){
      if(d['病虫害情况']==='严重' && !(d[n]||'').trim()) miss.push(n+'（病虫害=严重必填）');
      return;
    }
    var optional = c.arg.indexOf('选填')>=0 || c.type.indexOf('单行文本')===0;
    if(optional) return;
    if(def.no===6||def.no===7){
      if(['抽查株数', def.no===6?'死亡株数':'存活株数'].indexOf(n)<0) return;
    }
    if(n.indexOf('整地规格')===0){
      if(!(d['整地长']&&d['整地宽']&&d['整地深'])) miss.push('整地规格 3 项');
      return;
    }
    var v=d[n];
    if(v==null || v==='') miss.push(n);
  });
  if(!(S.result[i])) miss.push('验收结果');
  if(!attSatisfied(i,def)) miss.push('附件');
  if(S.result[i]==='整改后合格' && !d['整改期限']) miss.push('整改期限');
  return miss;
}

/* ---------- 主渲染 ---------- */
function renderPanel(){
  var p=document.getElementById('panel');
  if(!S.flow){ p.innerHTML='<div class="card mut sm">本版本仅实现「流程-人工造林」。请选择一个「人工造乔木林」小班。</div>'; return; }
  var i=S.cur, def=S.steps[i].def;
  var locked=!unlocked(i);
  var h='<div class="card'+(locked?' locked':'')+'">';
  h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
     '<h2>'+esc(def.step)+'</h2><span class="badge">'+esc(def.type)+'</span>'+
     '<span class="mut3 sm" style="margin-left:auto">第 '+def.no+' / '+S.steps.length+' 环节</span></div>';
  h+='<div class="tiny mut3" style="margin-top:4px">'+esc(def.memo)+'</div>';
  h+='<div class="tiny mut3" style="margin-top:2px">填报要求：'+esc(def.req)+' · 校验方式：'+esc(def.check)+' · 通过标准：'+esc(def.pass)+'</div>';
  if(locked) h+='<div class="warnbox">前一环节尚未提交，按「转序规则」本环节不可填报：'+esc(S.steps[i-1].def.seq)+'</div>';
  else h+='<div id="ctls" style="margin-top:12px">'+ctlHtml(i,def)+'</div>';
  h+='<div id="att-'+i+'"></div>';
  h+='</div>';
  p.innerHTML=h;

  if(!locked) attHtml(i,def);
  bind(i,def);
  verdict(i,def);
}

function verdict(i,def){
  var d=S.data[i]||{}, r=S.row;
  function set(k,txt,cls){
    var e=document.querySelector('[data-v="'+k+'"]'); if(e){ e.textContent=txt; e.className='verdict '+cls; }
  }
  if(def.no===2){
    var sp=String(stdOf('整地规格',r)||'').split(/[×xX*]/).map(Number);
    var v=['整地长','整地宽','整地深'].map(function(k){return d[k]});
    if(v.every(function(x){return x!==undefined&&x!==''&&x!=null;})){
      var pass=v.every(function(x,i){return x>=sp[i];});
      set('整地', v.join('×')+' × '+sp.join('×')+(pass?' · 对照通过':' · 低于标准，不合格'), pass?'ok':'bad');
    } else set('整地','三项填齐后自动对照标准值','hint');
  }
  if(def.no===4){
    var tot=Number(stdOf('总株数',r));
    if(d['种植数量']){
      var n=+d['种植数量'];
      set('株数','累计 '+n+' / 设计 '+tot+' 株'+(n>tot?' · 超出设计株数':(n===tot?' · 已达设计株数':' · 还差 '+(tot-n)+' 株')), n>tot?'bad':'ok');
    } else set('株数','支持分批累计，填第几批就填几批','hint');
    if(d['混交比例实核']){
      var dev=Math.abs((+d['混交比例实核']/100)-Number(stdOf('混交比例',r)));
      set('混交','设计 '+stdOf('混交比例',r)+'，实核 '+d['混交比例实核']+'%，偏差 '+(dev*100).toFixed(1)+' 个百分点', dev<=0.05?'ok':'bad');
    }
  }
  ['底肥用量'].forEach(function(n){
    if(d[n]!=null&&d[n]!==''){
      set(n, (+d[n]>0? '已填 · 大于 0 通过' : '必须大于 0'), (+d[n]>0?'ok':'bad'));
    }
  });
  /* 环节 6/7：随录入实时刷新自动算框 */
  if(def.no===6||def.no===7){
    var rate=rateOf(def,d);
    var el=document.getElementById('autoRate');
    if(el) el.textContent = rate==null?'—':rate.toFixed(1)+'%';
  }
}

function bind(i,def){
  var d=S.data[i]||(S.data[i]={});
  var card=document.getElementById('ctls'); if(!card) return;

  Array.prototype.forEach.call(card.querySelectorAll('[data-k]'),function(el){
    var k=el.dataset.k;
    var ev = (el.tagName==='SELECT')?'change':'input';
    el.addEventListener(ev,function(){
      d[k]=el.value;
      if(k==='验收结果') S.result[i]=el.value;
      if(k==='病虫害情况'||k==='验收结果') renderPanel();
      verdict(i,def);
      renderSubmit(i,def);
    });
  });
  Array.prototype.forEach.call(card.querySelectorAll('[data-conf]'),function(el){
    el.addEventListener('change',function(){
      d['确认项']=d['确认项']||{};
      d['确认项'][el.dataset.conf]=el.checked;
      renderPanel(); renderSubmit(i,def);
    });
  });
  Array.prototype.forEach.call(card.querySelectorAll('[data-multi]'),function(el){
    el.addEventListener('change',function(){
      var n=el.dataset.multi, f=el.closest('.factor').querySelector('.fname').textContent;
      d[f]=d[f]||[];
      var ix=d[f].indexOf(n);
      if(el.checked && ix<0) d[f].push(n); else if(!el.checked && ix>=0) d[f].splice(ix,1);
      renderPanel(); renderSubmit(i,def);
    });
  });
}

function renderSubmit(i,def){
  var miss=gateOf(i,def), bar=document.getElementById('submitBar');
  var reqs=parseAtt(def.att);
  var attNeed=reqs.filter(function(a){return a.min>0;}).length;
  var ok=miss.length===0;
  bar.innerHTML='<span class="prog">必填未完成 '+miss.length+' 项'+(miss.length?'：'+esc(miss.join('、')):'，可以提交')+'</span>'+
    (ok?'<span class="tiny" style="color:var(--ok)">附件已满足</span>':'')+
    (ok?'':'<span class="why">未完成，提交置灰</span>')+
    '<button class="pri" '+(ok?'':'disabled')+'>提交本环节</button>';
  var b=bar.querySelector('button');
  b.onclick=function(){
    S.submitted[i]=true;
    S.data[i].验收人='雷华雄';
    S.data[i].验收日期=S.data[i].验收日期||'2026-10-14';
    if(i+1<S.steps.length){ S.cur=i+1; }
    renderAll();
    toastOk('已提交「'+def.step+'」');
  };
}

function toastOk(msg){
  var t=document.createElement('div');
  t.textContent='✓ '+msg;
  t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f6e56;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:99';
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},1600);
}

function renderAll(){
  renderSteps(); renderPanel();
  if(S.flow) renderSubmit(S.cur, S.steps[S.cur].def);
  renderPick();
  renderDemos();
}
