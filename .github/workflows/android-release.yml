name: Android Release

# 触发：推送 v* 标签（如 v0.8.0）或 Actions 页手动运行
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      # Secrets 需配置：
      #   KEYSTORE_BASE64   ← base64 -i android/supervision-release.jks | pbcopy（macOS）
      #   KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS ← 见本地 android/keystore.properties
      - name: Restore signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Secrets 未配置时跳过：gradle 读不到 keystore.properties 自动回退 debug 签名，仍可出包
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/supervision-release.jks
            printf 'storeFile: supervision-release.jks\nkeyAlias: %s\nstorePassword: %s\nkeyPassword: %s\n' \
              "$KEY_ALIAS" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > android/keystore.properties
          else
            echo '::warning::KEYSTORE_BASE64 未配置，本次使用 debug 签名'
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
