name: Release APK

# 推送 v* 标签触发：构建签名 APK 并发布到 GitHub Releases（资产不过期）
# Secrets 未配置时自动回退 debug 签名（仅供测试）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17（Capacitor 6 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖并同步 Capacitor
        run: |
          npm install --no-fund --no-audit
          npx cap sync android

      # Secrets 需配置：
      #   KEYSTORE_BASE64   ← base64 -i android/supervision-release.jks | pbcopy（macOS）
      #   KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD ← 见本地 android/keystore.properties
      - name: 恢复签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/supervision-release.jks
            printf 'storeFile: supervision-release.jks\nkeyAlias: %s\nstorePassword: %s\nkeyPassword: %s\n' \
              "$KEY_ALIAS" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > android/keystore.properties
            echo '使用正式签名'
          else
            echo '::warning::KEYSTORE_BASE64 未配置，本次使用 debug 签名'
          fi

      - name: Gradle 打包 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 发布到 GitHub Releases（中文名称）
        uses: softprops/action-gh-release@v2
        with:
          name: 监理验收 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            监理验收 App（Android 安装包）

            - 版本：${{ github.ref_name }}
            - 安装后打开 App 自动加载线上最新页面（远程 URL 壳，网页更新无需重装）
            - appId：top.bibook.supervision
          files: android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
