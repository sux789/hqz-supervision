name: Cleanup APK

# 一次性清理：删除所有 Release 中的 .apk 资产（长期）+ 全部 Actions 工件（短期）。
# 仅当本文件自身变更时触发，跑完即删。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-apk.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 Release APK 资产与 Actions 工件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # 1) 删除所有 Release 中的 .apk 资产（长期保留物）
          for id in $(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases?per_page=100" \
              | jq -r '.[] | .assets[]? | select(.name | endswith(".apk")) | .id'); do
            echo "del release asset $id"
            curl -sf -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/assets/$id"
          done
          # 2) 删除所有 Actions 工件（短期保留物）
          for id in $(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100" \
              | jq -r '.artifacts[].id'); do
            echo "del artifact $id"
            curl -sf -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id"
          done
          echo "cleanup done"
