<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hqz-supervision · 网格填表</title>
  <!-- jsuites/jspreadsheet 自托管（国内 jsdelivr CDN 不可靠，曾致网格页白屏） -->
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/jsuites.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/jspreadsheet.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- 登录 -->
  <div id="viewLogin" class="center-wrap hidden">
    <form id="loginForm" class="login-card">
      <h1>网格填表</h1>
      <p class="muted">监理验收 · 中幼林抚育</p>
      <input id="loginUser" placeholder="用户名" autocomplete="username" required>
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password" required>
      <button type="submit" class="btn primary">登录</button>
      <div id="loginErr" class="err"></div>
    </form>
  </div>

  <!-- 主体：工作簿列表 / 小班列表 / 小班详情 -->
  <div id="viewMain" class="hidden">
    <header class="topbar">
      <button id="btnBack" class="btn ghost hidden">←</button>
      <span id="pageName" class="page-name"></span>
      <span class="spacer"></span>
      {% if role == 'admin' %}<a class="btn ghost" href="{{ url_for('sup.admin_page') }}">后台</a>{% endif %}
      <span id="whoami" class="muted" data-user="{{ user or '' }}"></span>
      <button id="btnLogout" class="btn ghost">退出</button>
    </header>

    <!-- ① 工作簿列表（上传在管理端 /admin） -->
    <section id="viewList" class="list-wrap hidden">
      <div id="lastChip"></div>
      <div id="wbList" class="wb-list"></div>
    </section>

    <!-- ② 单页编辑：顶部搜索栏（搜索选项驱动 select/search）+ 两列表单（自动保存）+ 拍照/轨迹/相片 -->
    <section id="viewDetail" class="detail-wrap hidden">
      <div id="selectorBar" class="selector-bar"></div>
      <div id="selMeta" class="muted sel-meta"></div>
      <div class="detail-toolbar">
        <span id="saveStatus" class="save-status ok">✓ 已保存</span>
        <span class="spacer"></span>
        <button id="btnExport" class="btn ghost">⬇ 导出</button>
        <button id="btnPhoto" class="btn primary hidden">📷 拍照</button>
        <button id="btnVideo" class="btn primary hidden">🎬 视频</button>
        <button id="btnTrack" class="btn primary hidden">◎ 轨迹</button>
        <button id="btnAlbum" class="btn ghost hidden">拍摄记录</button>
      </div>
      <div id="formEl"></div>
      <div id="photoHint" class="muted photo-hint"></div>
      <div id="rowPhotos" class="shot-wrap"></div>
    </section>
  </div>

  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

  <!-- 修改密码弹层（v0.21）：点右上角用户名打开，仅本人可改自己 -->
  <div id="pwdMask" class="album-mask hidden">
    <div class="pwd-panel">
      <b>修改密码 · <span id="pwdWho"></span></b>
      <label>原密码<input id="pwdOld" type="password" autocomplete="current-password" placeholder="当前密码"></label>
      <label>新密码（至少 4 位）<input id="pwdNew" type="password" autocomplete="new-password" placeholder="新密码"></label>
      <label>确认新密码<input id="pwdNew2" type="password" autocomplete="new-password" placeholder="再输一次"></label>
      <div class="pwd-btns">
        <button id="pwdSave" class="btn primary">保存</button>
        <button id="pwdCancel" class="btn ghost">取消</button>
      </div>
      <div id="pwdMsg" class="err"></div>
      <div class="muted" style="font-size:12px;">改完密码后本机无需重新登录；其他同事的登录状态不受影响。</div>
    </div>
  </div>

  <!-- 系统相机录制兜底（v0.12）：本机 WebView 不支持 MP4 录制时走这里，硬件 H.264 → 必播 -->
  <input type="file" id="videoInput" accept="video/*" capture="camcorder" hidden>

  <!-- 录制遮罩（v0.11）：getUserMedia 预览 + MediaRecorder 边录边压，**只存手机本地，不上传** -->
  <div id="recMask" class="rec-mask hidden">
    <video id="recPreview" playsinline muted autoplay></video>
    <div class="rec-topbar">
      <span id="recDot" class="rec-dot"></span>
      <span id="recTime" class="rec-time">00:00</span>
      <span id="recHint" class="rec-hint"></span>
      <span class="spacer"></span>
      <button id="recCancel" class="btn ghost rec-cancel">取消</button>
    </div>
    <div class="rec-stopbar">
      <button id="recStop" class="rec-stop" title="停止并保存到手机">
        <span class="rec-stop-ico"></span>
        <span class="rec-stop-txt">停止并保存到手机</span>
      </button>
    </div>
  </div>

  <!-- 拍摄记录弹层（仅本机记录的文件名提示，C07 不预览图片） -->
  <div id="albumMask" class="album-mask hidden">
    <div class="album-panel">
      <header class="album-head">
        <b>拍摄记录</b>
        <span id="albumMeta" class="muted"></span>
        <span class="spacer"></span>
        <button id="albumClose" class="btn ghost">关闭</button>
      </header>
      <div id="shotAll" class="album-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>window.SUP_BASE = {{ request.script_root | tojson }};</script>
  <script src="{{ url_for('static', filename='vendor/jsuites.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/jspreadsheet.min.js') }}"></script>
  <!-- ?v= 版本号熔断：静态 JS 更新后 WebView/浏览器强制拉新（曾致 APK 端验收联动代码不生效） -->
  <script src="{{ url_for('static', filename='app.js') }}?v=0.28"></script>
</body>
</html>
